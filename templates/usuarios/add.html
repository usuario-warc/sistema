{% extends "base.html" %}
{% block title %}Agregar Usuario{% endblock %}

{% block content %}
<h1>Agregar Usuario</h1>
<form method="POST" action="{{ url_for('usuarios_add') }}">
    <div class="mb-3">
        <label for="nombre_completo" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="nombre_completo" name="nombre_completo" required>
    </div>
    <div class="mb-3">
        <label for="correo" class="form-label">Correo</label>
        <input type="email" class="form-control" id="correo" name="correo" required>
    </div>
    <div class="mb-3">
        <label for="nombre_usuario" class="form-label">Nombre de usuario</label>
        <input type="text" class="form-control" id="nombre_usuario" name="nombre_usuario" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <div class="mb-3">
        <label for="rol" class="form-label">Rol</label>
        <select class="form-select" id="rol" name="rol" required>
            <option value="admin">Administrador</option>
            <option value="docente" selected>Docente</option>
            <option value="supervisor">Supervisor</option>
            <option value="empleado">Empleado</option>
        </select>
        <div class="form-text">
            Si eliges <strong>Docente</strong>, después de crear el usuario asígnale sus secciones y
            asignaturas desde <a href="{{ url_for('asignaciones') }}">Permisos de Docentes</a>.
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('usuarios') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
