{% extends "base.html" %}
{% block title %}Agregar Asignatura{% endblock %}

{% block content %}
<h1>Agregar Asignatura</h1>
<form method="POST" class="mt-3">
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre de la asignatura</label>
        <input type="text" id="nombre" name="nombre" class="form-control"
               placeholder="Ej. Software" maxlength="100" required>
    </div>
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{{ url_for('asignaturas') }}" class="btn btn-secondary">Volver</a>
</form>
{% endblock %}
