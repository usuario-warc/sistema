{% extends "base.html" %}
{% block title %}Editar Asignatura{% endblock %}

{% block content %}
<h1>Editar Asignatura</h1>
<form method="POST" class="mt-3">
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre de la asignatura</label>
        <input type="text" id="nombre" name="nombre" class="form-control"
               value="{{ asignatura.nombre }}" maxlength="100" required>
    </div>
    <button type="submit" class="btn btn-primary">Guardar cambios</button>
    <a href="{{ url_for('asignaturas') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
