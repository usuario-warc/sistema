<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Asistencia Escolar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1b2340, #2b2f77);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 45px rgba(0,0,0,.25);
            overflow: hidden;
        }
        .login-brand {
            background: linear-gradient(180deg, #1b2340, #2b2f77);
            color: #fff;
            text-align: center;
            padding: 2rem 1.5rem 1.5rem;
        }
        .login-brand i { font-size: 2.4rem; }
        .login-brand h1 { font-size: 1.25rem; font-weight: 700; margin: .5rem 0 0; }
        .login-brand p { font-size: .85rem; color: rgba(255,255,255,.7); margin: .25rem 0 0; }
        .login-body { padding: 2rem 1.75rem; background: #fff; }
        .btn-login {
            background: #4a6cf7;
            border: none;
            font-weight: 600;
            padding: .65rem;
            border-radius: 8px;
        }
        .btn-login:hover { background: #3a5ce0; }
        .form-control { border-radius: 8px; padding: .6rem .9rem; }
    </style>
</head>
<body>

    <div class="card login-card animate__animated animate__fadeInUp">
        <div class="login-brand">
            <i class="bi bi-mortarboard-fill"></i>
            <h1>Asistencia Escolar</h1>
            <p>Ingresa con tu usuario y contraseña</p>
        </div>
        <div class="login-body">
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="nombre_usuario" class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person-fill"></i></span>
                        <input type="text" class="form-control" id="nombre_usuario" name="nombre_usuario"
                               autocomplete="username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-login btn-primary w-100 text-white">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
                </button>
            </form>
        </div>
    </div>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% if mensajes %}
            {% for categoria, mensaje in mensajes %}
                <script>
                    document.addEventListener('DOMContentLoaded', function() {
                        const iconType = '{{ categoria }}' === 'danger' ? 'error' : '{{ categoria }}';
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: iconType || 'info',
                            title: '{{ mensaje }}',
                            showConfirmButton: false,
                            timer: 3500,
                            timerProgressBar: true
                        });
                    });
                </script>
            {% endfor %}
        {% endif %}
    {% endwith %}

</body>
</html>
