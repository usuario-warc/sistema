{% extends "base.html" %}
{% block title %}Editar Sección{% endblock %}

{% block content %}
<h1>Editar Sección</h1>
<form method="POST" class="mt-3">
    <div class="mb-3">
        <label for="especialidad" class="form-label">Especialidad</label>
        <input type="text" id="especialidad" name="especialidad" class="form-control"
               value="{{ seccion.especialidad }}" maxlength="100" required>
    </div>
    <div class="mb-3">
        <label for="codigo_seccion" class="form-label">Código de sección</label>
        <input type="text" id="codigo_seccion" name="codigo_seccion" class="form-control"
               value="{{ seccion.codigo_seccion }}" maxlength="10" required>
    </div>
    <div class="mb-3">
        <label for="grado" class="form-label">Grado</label>
        <input type="number" id="grado" name="grado" class="form-control"
               value="{{ seccion.grado }}" min="0" max="127" required>
    </div>
    <button type="submit" class="btn btn-primary">Actualizar</button>
    <a href="{{ url_for('secciones') }}" class="btn btn-secondary">Volver</a>
</form>
{% endblock %}
